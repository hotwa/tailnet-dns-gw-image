name: Build candidate image

on:
  workflow_dispatch:
  schedule:
    - cron: "47 20 * * *"
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: tailnet-dns-gw-candidate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      candidate: ${{ steps.meta.outputs.candidate }}
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Check out image pipeline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run repository contract tests
        shell: bash
        run: tests/test-contract.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Resolve official stable releases to immutable image digests
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          source pipeline.env
          latest_release() {
            local repository=$1 tag
            tag=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$repository/releases/latest" |
              jq -r '.tag_name')
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "unexpected latest release tag for $repository: $tag" >&2
              exit 1
            }
            printf '%s\n' "$tag"
          }
          require_minimum() {
            local actual=${1#v} minimum=$2 name=$3 first
            first=$(printf '%s\n%s\n' "$minimum" "$actual" | sort -V | head -n1)
            [ "$first" = "$minimum" ] || {
              echo "$name release $actual is below minimum $minimum" >&2
              exit 1
            }
          }
          resolve_digest() {
            local ref=$1 inspection digest
            inspection=$(docker buildx imagetools inspect "$ref")
            digest=$(printf '%s\n' "$inspection" | awk '/^Digest:/ {print $2; exit}')
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "unable to resolve digest for $ref" >&2
              exit 1
            }
            printf '%s\n' "$digest"
          }
          tailscale_version=$(latest_release "$TAILSCALE_REPOSITORY")
          adguardhome_version=$(latest_release "$ADGUARDHOME_REPOSITORY")
          require_minimum "$tailscale_version" "$TAILSCALE_MIN_VERSION" Tailscale
          require_minimum "$adguardhome_version" "$ADGUARDHOME_MIN_VERSION" AdGuardHome
          tailscale_ref="$TAILSCALE_IMAGE:$tailscale_version"
          adguardhome_ref="$ADGUARDHOME_IMAGE:$adguardhome_version"
          tailscale_digest=$(resolve_digest "$tailscale_ref")
          adguardhome_digest=$(resolve_digest "$adguardhome_ref")
          tailscale_image="$TAILSCALE_IMAGE@$tailscale_digest"
          adguardhome_image="$ADGUARDHOME_IMAGE@$adguardhome_digest"
          owner=${GITHUB_REPOSITORY_OWNER,,}
          image="ghcr.io/$owner/$IMAGE_NAME"
          key=$(printf '%s\n%s\n%s\n%s\n' \
            "$PIPELINE_EPOCH" "$tailscale_digest" "$adguardhome_digest" "$GITHUB_SHA" |
            sha256sum | awk '{print $1}')
          candidate="$image:candidate-$PIPELINE_EPOCH-$key"
          {
            printf 'image=%s\n' "$image"
            printf 'candidate=%s\n' "$candidate"
            printf 'tailscale_image=%s\n' "$tailscale_image"
            printf 'adguardhome_image=%s\n' "$adguardhome_image"
            printf 'tailscale_version=%s\n' "$tailscale_version"
            printf 'adguardhome_version=%s\n' "$adguardhome_version"
            printf 'tailscale_digest=%s\n' "$tailscale_digest"
            printf 'adguardhome_digest=%s\n' "$adguardhome_digest"
          } >> "$GITHUB_OUTPUT"
          {
            printf 'Candidate: `%s`\n\n' "$candidate"
            printf 'Tailscale: `%s` (`%s`)\n\n' "$tailscale_version" "$tailscale_image"
            printf 'AdGuard Home: `%s` (`%s`)\n' "$adguardhome_version" "$adguardhome_image"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether candidate already exists
        id: existing
        if: github.event_name != 'pull_request'
        env:
          CANDIDATE: ${{ steps.meta.outputs.candidate }}
        shell: bash
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$CANDIDATE" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo 'Candidate already exists; immutable tag will not be overwritten.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Build test target
        if: github.event_name == 'pull_request' || steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          target: test
          push: false
          pull: true
          platforms: linux/amd64
          build-args: |
            TAILSCALE_IMAGE=${{ steps.meta.outputs.tailscale_image }}
            ADGUARDHOME_IMAGE=${{ steps.meta.outputs.adguardhome_image }}
            PIPELINE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=tailnet-dns-gw
          cache-to: type=gha,scope=tailnet-dns-gw,mode=max

      - name: Build and publish runtime candidate
        id: publish
        if: github.event_name != 'pull_request' && steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          target: runtime
          push: true
          pull: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.candidate }}
          build-args: |
            TAILSCALE_IMAGE=${{ steps.meta.outputs.tailscale_image }}
            ADGUARDHOME_IMAGE=${{ steps.meta.outputs.adguardhome_image }}
            PIPELINE_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.jmsu.tailnet-dns-gw.tailscale-digest=${{ steps.meta.outputs.tailscale_digest }}
            io.jmsu.tailnet-dns-gw.adguardhome-digest=${{ steps.meta.outputs.adguardhome_digest }}
            io.jmsu.tailnet-dns-gw.tailscale-version=${{ steps.meta.outputs.tailscale_version }}
            io.jmsu.tailnet-dns-gw.adguardhome-version=${{ steps.meta.outputs.adguardhome_version }}
          cache-from: type=gha,scope=tailnet-dns-gw
          cache-to: type=gha,scope=tailnet-dns-gw,mode=max
          provenance: mode=max
          sbom: true

      - name: Attest published image
        if: github.event_name != 'pull_request' && steps.existing.outputs.exists != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
